name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify and publish internal release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Node and pipeline tests
        run: |
          npm test
          npm run test:pipeline
      - name: Create source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git archive --format=tar.gz --prefix="eagleye-${RELEASE_TAG}/" "${RELEASE_TAG}" > "eagleye-${RELEASE_TAG}.tar.gz"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" "eagleye-${RELEASE_TAG}.tar.gz" \
            --title "Eagleye ${RELEASE_TAG}" \
            --generate-notes \
            --prerelease
