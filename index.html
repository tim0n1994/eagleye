<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eagleye — AI-Driven Technology Intelligence</title>
  <meta name="description" content="Eagleye — Personal information filtering engine for AI, developers, and founders. 19 sources, AI knowledge cards, multi-dimensional alpha scoring, cross-source story clustering, personalized filtering, and entity analytics.">
  <meta name="theme-color" content="#0e1c2c">
  <meta property="og:title" content="Eagleye — AI Technology Intelligence Radar">
  <meta property="og:description" content="Personal information filtering engine: 19 sources, AI knowledge cards, alpha scoring, entity analytics, personalized filtering.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Eagleye — AI Technology Intelligence Radar">
  <meta name="twitter:description" content="Personal information filtering engine with multi-dimensional alpha scoring and personalized filtering.">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="stylesheet" href="/css/style.css?v1780775161">
  <link rel="stylesheet" href="/css/katex.min.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- First tab stop: the header has ~20 focusable elements before the
       content starts, and the SPA re-renders under it on every route. -->
  <a href="#pageContent" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>
  <!-- aria-live region: announced on every route change (see router afterEach)
       so screen-reader users hear the new page even when the focus move is
       suppressed. role="status" is assertive enough to interrupt, polite
       enough not to crowd out other speech. -->
  <div id="srStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true" data-i18n-attr="aria-label|a11y.status"></div>
  <script>
    (function() {
      // Theme: use stored pref, or auto-detect from system preference (prefers-color-scheme).
      const storedTheme = localStorage.getItem('eagleye-theme');
      const theme = storedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      const stored = localStorage.getItem('eagleye-lang');
      const lang = (stored === 'en' || stored === 'zh') ? stored
        : ((navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en');
      document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
      document.documentElement.setAttribute('data-lang', lang);
    })();
  </script>

  <!-- Header / SiteNav -->
  <header class="header" role="banner">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-logo" aria-hidden="true">🦅</span>
        <div class="header-title-group">
          <a href="/" class="header-title-link">
            <h1 class="header-title">Eagleye</h1>
          </a>
          <span class="header-subtitle" data-i18n="brand.subtitle">INTELLIGENCE RADAR</span>
        </div>
      </div>
      <nav class="site-nav" id="mainNav" aria-label="Main navigation">
        <!-- Rendered by JS -->
      </nav>
      <div class="header-actions">
        <a class="icon-btn" id="userLink" href="/login" title="Sign In" style="text-decoration:none;font-size:12px;padding:6px 10px;">
          <span>Sign In</span>
        </a>
        <button class="icon-btn lang-btn" id="langToggle" title="Switch language">
          <span class="lang-btn-label">中</span>
        </button>
        <a class="icon-btn" id="settingsLink" href="/settings" title="Settings — LLM Endpoint" style="text-decoration:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </a>
        <button class="icon-btn" id="themeToggle" title="Toggle Dark/Light Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
          </svg>
        </button>
        <button class="icon-btn" id="showGraph" title="Knowledge Graph">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>
        <button class="icon-btn" id="syncNow" title="Sync Sources">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-layout" id="mainContent" role="main" aria-label="Main content">
    <!-- Status Bar (shown only on legacy home) -->
    <div class="status-bar" id="statusBar" style="display:none;">
      <div class="status-left">
        <span class="status-dot"></span>
        <span id="lastUpdated" data-i18n="system.online">SYSTEM ONLINE</span>
      </div>
      <div class="status-right">
        <div class="search-wrap">
          <input type="text" class="search-input-minimal" id="searchInput" placeholder="SEARCH SIGNALS..." autocomplete="off" data-i18n-attr="placeholder|common.search_ph">
        </div>
        <button class="sync-btn" id="legacySync">SYNC NOW</button>
      </div>
    </div>

    <!-- Legacy Items Grid (hidden on non-home pages) -->
    <div class="items-grid" id="itemsGrid" style="display:none;">
      <!-- Rendered by legacy JS -->
    </div>

    <!-- Page Content (SPA pages render here) -->
    <div class="page-content" id="pageContent" tabindex="-1" style="display:block;">
      <!-- Rendered by router -->
    </div>
  </main>

  <!-- Right Sidebar: Agent Progress + Message Log (collapsible) -->
  <button class="sidebar-toggle" id="sidebarToggle" title="Toggle Sidebar" data-i18n-attr="title|header.sidebar_attr">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>
  <aside class="right-sidebar" id="rightSidebar" role="complementary" aria-label="Agent activity and message log">
    <div class="sidebar-header">
      <button class="sidebar-close" id="sidebarClose" title="Close sidebar" data-i18n-attr="title|header.close_sidebar_attr">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="sidebar-content">
      <div class="sidebar-section">
        <div class="panel-header">
          <span class="panel-title" data-i18n="sidebar.agents">AGENT PROGRESS</span>
          <span class="panel-badge" id="agentCount">0</span>
        </div>
        <div class="agent-list" id="agentList">
          <div class="agent-empty" data-i18n="sidebar.idle">IDLE — No active agents</div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="panel-header">
          <span class="panel-title" data-i18n="sidebar.log">MESSAGE LOG</span>
          <button class="panel-clear-btn" id="clearLog" title="Clear log" data-i18n-attr="title|sidebar.clear">✕</button>
        </div>
        <div class="log-entries" id="logEntries">
          <div class="log-entry log-info">
            <span class="log-time">--:--:--</span>
            <span class="log-msg" data-i18n="system.ready">System ready. Waiting for activity...</span>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Graph Overlay -->
  <div id="graphOverlay" class="graph-overlay">
    <div class="graph-header">
      <h2 data-i18n="header.graph_attr">Knowledge Graph</h2>
      <button id="closeGraph" class="close-btn">&times;</button>
    </div>
    <div id="graphCanvas"></div>
  </div>

  <!-- Footer -->
  <footer class="footer" id="mainFooter" role="contentinfo">
    <!-- Rendered by JS -->
  </footer>
  <script type="module" src="/js/app.js?v1780775161"></script>
</body>
</html>
