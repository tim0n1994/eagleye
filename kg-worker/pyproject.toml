[project]
name = "eagleye-kg-worker"
version = "0.1.0"
description = "Eagleye KG v2 deterministic extraction worker"
requires-python = ">=3.11"
dependencies = [
  "fastembed>=0.7.0",
]

[project.scripts]
eagleye-kg = "eagleye_kg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eagleye_kg"]
