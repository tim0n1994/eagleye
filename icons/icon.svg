<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Eagle body -->
  <g transform="translate(256,280) scale(1.1)">
    <!-- Wings -->
    <path d="M-10,-100 C-60,-80 -140,-60 -170,-20 C-180,0 -160,10 -140,0 C-120,-10 -90,-30 -60,-40"
          fill="url(#accent)" opacity="0.9"/>
    <path d="M10,-100 C60,-80 140,-60 170,-20 C180,0 160,10 140,0 C120,-10 90,-30 60,-40"
          fill="url(#accent)" opacity="0.9"/>
    <!-- Body -->
    <ellipse cx="0" cy="-20" rx="30" ry="50" fill="#e8eaed"/>
    <!-- Head -->
    <circle cx="0" cy="-75" r="22" fill="#e8eaed"/>
    <!-- Beak -->
    <path d="M-6,-82 L0,-95 L6,-82 Z" fill="#f59e0b"/>
    <!-- Eye -->
    <circle cx="0" cy="-78" r="3" fill="#1a1a2e"/>
  </g>
</svg>
